name: linting-typechecking-doctests

# Source: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#using-multiple-python-versions

on: [pull_request, workflow_dispatch]

jobs:
  install_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      # Test the companion PRs before their version bumps are published to PyPI.
      # Remove this step once ncls 0.0.71, sorted_nearest 0.0.42 and pyrle 0.0.46 are released.
      - name: Install backend PR revisions
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install \
            "git+https://github.com/pyranges/ncls.git@476c1a32b2a9bdca397b08d26386e32c5f66f878" \
            "git+https://github.com/pyranges/sorted_nearest.git@73575c771192235d6be0542fb5b9fe04a9470e39" \
            "git+https://github.com/pyranges/pyrle.git@41d1a8049464952b2d47064a7828d49a6359bc86"
      - name: Install
        run: pip install .
      - name: Use pandas 2 on the oldest tested Python
        if: matrix.python-version == '3.11'
        run: pip install 'pandas>=2.3,<3'
      - name: Install add-ons
        run: pip install ".[coverage]" pybigwig bamread pyfaidx fisher
      - run: pip install pytest
      - name: doctests
        env:
          COLUMNS: "80"
        run: |
          env -u GITHUB_ACTIONS pytest --doctest-modules pyranges
      - name: unittests
        env:
          GITHUB_ACTIONS: true
        run: |
          pytest tests/unit

  isort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install isort
      - run: isort --profile black -l 120 --check --diff .

  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          max-line-length: "120"
      - run: pip install black
      - run: black -l 120 --check --diff pyranges tests

  flake8:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Check out source repository
        uses: actions/checkout@v3
      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: flake8 Lint install
        run: pip install flake8
      - name: flake8 Lint
        run: flake8 --max-line-length=120 --ignore E203,E501,W503 pyranges

  mypy:
    runs-on: ubuntu-latest
    name: Mypy
    steps:
      - name: Check out source repository
        uses: actions/checkout@v3
      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install mypy
        run: pip install mypy
      - name: mypy
        run: |
          pip install numpy  # for the typing stubs
          python -m pip install pandas-stubs types-setuptools types-tabulate 
          mypy pyranges
